<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENT - Direction (Lycée Paul de Staël)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #f4f6f9; --text-main: #1e293b; --primary: #8b5cf6; --danger: #ef4444; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #e2e8f0; padding: 24px; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.02); }
        .main-content { flex: 1; padding: 35px; overflow-y: auto; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-top: 0; margin-bottom: 20px; color: #0f172a; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 32px; border-radius: 20px; width: 480px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        
        .viewer-box { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .schedule-container { overflow: hidden; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 15px; }
        .schedule-grid { display: grid; grid-template-columns: 90px repeat(5, minmax(140px, 1fr)); grid-template-rows: 50px repeat(9, 65px); background-color: #e2e8f0; gap: 1px; }
        .grid-header { background: #f8fafc; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #475569; }
        .time-label { background: #f8fafc; font-size: 11px; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: 600; border-right: 1px solid #e2e8f0; }
        .grid-cell { background: #ffffff; position: relative; }
        .course-card { position: absolute; top: 3px; bottom: 3px; left: 3px; right: 3px; background: #8b5cf6; color: white; border-radius: 8px; padding: 4px; font-size: 11px; display: flex; flex-direction: column; justify-content: center; text-align: center; font-weight: 600; cursor: pointer; }
        .list-item { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div style="font-weight:700; margin-bottom:40px;">Lycée Paul de Staël (Direction)</div>
        <button class="btn-action" style="margin-top:auto; background:var(--danger);" id="btn-logout">Se déconnecter</button>
    </nav>
    <main class="main-content">
        <h1>Administration & Suivi</h1>
        <div class="grid">
            <div class="card">
                <h2>Comptes & Élèves</h2>
                <button class="btn-action" onclick="openModal('modal-account')">Créer un compte</button>
                <button class="btn-action" style="background:#0ea5e9;" onclick="openModal('modal-affect')">Associer Élève</button>
                <button class="btn-action" style="background:#f59e0b;" onclick="openModal('modal-profs')">Gérer les Professeurs</button>
            </div>
            <div class="card">
                <h2>Structure</h2>
                <button class="btn-action" onclick="openModal('modal-class')">Créer une classe</button>
                <button class="btn-action" onclick="openModal('modal-subject')">Gérer les matières</button>
            </div>
            <div class="card">
                <h2>Emploi du temps</h2>
                <button class="btn-action" onclick="openModal('modal-edt')">Planifier un créneau</button>
            </div>
        </div>

        <div class="viewer-box">
            <h3>Supervision des Emplois du Temps</h3>
            <div style="display:flex; gap:15px; margin-bottom:15px;">
                <select id="view-type" onchange="toggleViewSelector()" style="width:200px;">
                    <option value="classe">Par Classe</option>
                    <option value="prof">Par Professeur</option>
                </select>
                <select id="view-target" onchange="loadSupervisionEDT()" style="flex:1;"></select>
            </div>
            <div class="schedule-container">
                <div class="schedule-grid" id="sup-grid"></div>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div class="modal-overlay" id="modal-account"><div class="modal-content"><h3>Nouveau compte</h3><form id="form-account">
        <div class="form-group"><label>Civilité</label><select id="acc-civilite"><option value="M.">M.</option><option value="Mme">Mme</option></select></div>
        <div class="form-group"><label>Rôle</label><select id="acc-role"><option value="eleve">Élève</option><option value="professeur">Professeur</option></select></div>
        <div class="form-group"><input type="text" id="acc-prenom" placeholder="Prénom" required></div>
        <div class="form-group"><input type="text" id="acc-nom" placeholder="Nom" required></div>
        <div class="form-group"><input type="email" id="acc-email" placeholder="Email" required></div>
        <div class="form-group"><input type="password" id="acc-pwd" placeholder="Mot de passe (6 car. min)" required></div>
        <button class="btn-action">Créer</button>
    </form></div></div>

    <div class="modal-overlay" id="modal-profs"><div class="modal-content"><h3>Gestion des Professeurs</h3>
        <div id="profs-list" style="margin-top:15px; max-height:400px; overflow-y:auto;">Chargement...</div>
        <button class="btn-action" style="margin-top:15px; background:#64748b;" onclick="document.getElementById('modal-profs').classList.remove('active')">Fermer</button>
    </div></div>

    <div class="modal-overlay" id="modal-affect"><div class="modal-content"><h3>Affecter un élève</h3><form id="form-affect"><div class="form-group"><label>Élève</label><select id="affect-eleve"></select></div><div class="form-group"><label>Classe</label><select id="affect-class"></select></div><button class="btn-action">Associer</button></form></div></div>
    
    <div class="modal-overlay" id="modal-class"><div class="modal-content"><h3>Nouvelle classe</h3><form id="form-class"><input type="text" id="class-name" placeholder="Nom" required><button class="btn-action" style="margin-top:15px;">Créer</button></form></div></div>
    
    <div class="modal-overlay" id="modal-subject"><div class="modal-content"><h3>Gestion des matières</h3>
        <form id="form-subject" style="margin-bottom:20px;"><input type="text" id="subject-name" placeholder="Nouvelle matière" required><button class="btn-action" style="margin-top:10px;">Ajouter</button></form>
        <div id="subjects-list">Chargement...</div>
        <button class="btn-action" style="margin-top:15px; background:#64748b;" onclick="document.getElementById('modal-subject').classList.remove('active')">Fermer</button>
    </div></div>
    
    <div class="modal-overlay" id="modal-edt"><div class="modal-content"><h3>Créneau Récurrent</h3><form id="form-edt">
        <div class="form-group"><label>Classe</label><select id="edt-class"></select></div>
        <div class="form-group"><label>Professeur</label><select id="edt-prof"></select></div>
        <div class="form-group"><label>Matière</label><select id="edt-subject"></select></div>
        <div class="form-group"><label>Jour</label><select id="edt-jour"><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option></select></div>
        <div class="form-group"><label>Heure de début</label><select id="edt-start">
            <option value="08:30">08:30</option><option value="09:25">09:25</option><option value="10:35">10:35</option><option value="11:30">11:30</option>
            <option value="13:05">13:05</option><option value="14:00">14:00</option><option value="14:55">14:55</option><option value="16:05">16:05</option><option value="17:00">17:00</option>
        </select></div>
        <div class="form-group"><label>Heure de fin</label><select id="edt-end">
            <option value="09:25">09:25</option><option value="10:20">10:20</option><option value="11:30">11:30</option><option value="12:25">12:25</option>
            <option value="14:00">14:00</option><option value="14:55">14:55</option><option value="15:50">15:50</option><option value="17:00">17:00</option><option value="17:55">17:55</option>
        </select></div>
        <button class="btn-action">Enregistrer</button>
    </form></div></div>

    <script>
        (function() {
            const supabase = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8');
            const secondary = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8', { auth: { persistSession: false } });

            const slots = [
                { start: "08:30", end: "09:25", row: 2 },
                { start: "09:25", end: "10:20", row: 3 },
                { start: "10:35", end: "11:30", row: 5 },
                { start: "11:30", end: "12:25", row: 6 },
                { start: "13:05", end: "14:00", row: 8 },
                { start: "14:00", end: "14:55", row: 9 },
                { start: "14:55", end: "15:50", row: 10 },
                { start: "16:05", end: "17:00", row: 12 },
                { start: "17:00", end: "17:55", row: 13 }
            ];

            window.openModal = async function(id) {
                document.getElementById(id).classList.add('active');
                loadDropdowns();
                if(id === 'modal-subject') loadSubjectsManager();
                if(id === 'modal-profs') loadProfsManager();
            }

            async function loadDropdowns() {
                const [profs, classes, subs, eleves] = await Promise.all([
                    supabase.from('profiles').select('id, nom, prenom, civilite').eq('role', 'professeur'),
                    supabase.from('classes').select('id, nom'),
                    supabase.from('matieres').select('id, nom'),
                    supabase.from('profiles').select('id, nom, prenom').eq('role', 'eleve')
                ]);
                if(profs.data) document.querySelectorAll('#edt-prof').forEach(s => s.innerHTML = profs.data.map(p => `<option value="${p.id}">${p.civilite || 'M.'} ${p.prenom} ${p.nom}</option>`).join(''));
                if(classes.data) document.querySelectorAll('#edt-class, #affect-class').forEach(s => s.innerHTML = classes.data.map(c => `<option value="${c.id}">${c.nom}</option>`).join(''));
                if(subs.data) document.querySelectorAll('#edt-subject').forEach(s => s.innerHTML = subs.data.map(m => `<option value="${m.id}">${m.nom}</option>`).join(''));
                if(eleves.data) document.getElementById('affect-eleve').innerHTML = eleves.data.map(el => `<option value="${el.id}">${el.prenom} ${el.nom}</option>`).join('');
            }

            async function loadProfsManager() {
                const { data } = await supabase.from('profiles').select('id, nom, prenom, civilite').eq('role', 'professeur');
                const container = document.getElementById('profs-list');
                if(data) {
                    container.innerHTML = data.map(p => `
                        <div class="list-item" style="flex-direction:column; align-items:stretch; gap:6px;">
                            <div style="display:flex; gap:6px;">
                                <select id="civ-${p.id}" style="width:70px;">
                                    <option value="M." ${p.civilite === 'M.' ? 'selected' : ''}>M.</option>
                                    <option value="Mme" ${p.civilite === 'Mme' ? 'selected' : ''}>Mme</option>
                                </select>
                                <input type="text" value="${p.prenom}" id="prenom-${p.id}">
                                <input type="text" value="${p.nom}" id="nom-${p.id}">
                            </div>
                            <button onclick="updateProf('${p.id}')" style="background:#0ea5e9; color:white; border:none; padding:6px; border-radius:4px; cursor:pointer; font-weight:600;">Enregistrer</button>
                        </div>
                    `).join('');
                }
            }

            window.updateProf = async function(id) {
                const civilite = document.getElementById(`civ-${id}`).value;
                const prenom = document.getElementById(`prenom-${id}`).value;
                const nom = document.getElementById(`nom-${id}`).value;
                await supabase.from('profiles').update({ civilite, prenom, nom }).eq('id', id);
                alert("Professeur mis à jour !"); loadProfsManager();
            }

            async function loadSubjectsManager() {
                const { data } = await supabase.from('matieres').select('id, nom');
                const container = document.getElementById('subjects-list');
                if(data) {
                    container.innerHTML = data.map(m => `
                        <div class="list-item">
                            <input type="text" value="${m.nom}" id="sub-input-${m.id}" style="flex:1;">
                            <button onclick="updateSubject('${m.id}')" style="background:#0ea5e9; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Modifier</button>
                            <button onclick="deleteSubject('${m.id}')" style="background:#ef4444; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Suppr.</button>
                        </div>
                    `).join('');
                }
            }

            window.updateSubject = async function(id) {
                const newName = document.getElementById(`sub-input-${id}`).value;
                await supabase.from('matieres').update({ nom: newName }).eq('id', id);
                alert("Matière modifiée !"); loadSubjectsManager();
            }

            window.deleteSubject = async function(id) {
                if(confirm("Supprimer cette matière ?")) {
                    await supabase.from('matieres').delete().eq('id', id);
                    loadSubjectsManager();
                }
            }

            window.toggleViewSelector = async function() {
                const type = document.getElementById('view-type').value;
                const target = document.getElementById('view-target');
                if(type === 'classe') {
                    const { data } = await supabase.from('classes').select('id, nom');
                    if(data) target.innerHTML = data.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
                } else {
                    const { data } = await supabase.from('profiles').select('id, nom, prenom, civilite').eq('role', 'professeur');
                    if(data) target.innerHTML = data.map(p => `<option value="${p.id}">${p.civilite || 'M.'} ${p.prenom} ${p.nom}</option>`).join('');
                }
                loadSupervisionEDT();
            }

            window.loadSupervisionEDT = async function() {
                const type = document.getElementById('view-type').value;
                const targetId = document.getElementById('view-target').value;
                const grid = document.getElementById('sup-grid');
                
                let gridHtml = `
                    <div class="grid-header" style="grid-column: 1; grid-row: 1;">Horaires</div>
                    <div class="grid-header" style="grid-column: 2; grid-row: 1;">Lundi</div>
                    <div class="grid-header" style="grid-column: 3; grid-row: 1;">Mardi</div>
                    <div class="grid-header" style="grid-column: 4; grid-row: 1;">Mercredi</div>
                    <div class="grid-header" style="grid-column: 5; grid-row: 1;">Jeudi</div>
                    <div class="grid-header" style="grid-column: 6; grid-row: 1;">Vendredi</div>
                `;
                slots.forEach(s => {
                    gridHtml += `<div class="time-label" style="grid-column: 1; grid-row: ${s.row};">${s.start}<br><span style="font-size:9px; opacity:0.7;">${s.end}</span></div>`;
                });
                grid.innerHTML = gridHtml;

                if(!targetId) return;

                let query = supabase.from('cours_recurrents').select('id, jour_semaine, heure_debut, heure_fin, matieres(nom), classes(nom), profiles(nom, prenom, civilite)');
                if(type === 'classe') query = query.eq('classe_id', targetId);
                else query = query.eq('prof_id', targetId);

                const { data: cours } = await query;
                if(cours) {
                    cours.forEach(c => {
                        const startSlot = slots.find(s => s.start === c.heure_debut);
                        const endSlot = slots.find(s => s.end === c.heure_fin);
                        if (!startSlot || !endSlot) return;

                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        cell.style.gridColumn = c.jour_semaine + 1;
                        cell.style.gridRowStart = startSlot.row;
                        const span = (endSlot.row - startSlot.row) + 1;
                        if (span > 1) cell.style.gridRowEnd = `span ${span}`;

                        cell.innerHTML = `
                            <div class="course-card" onclick="deleteCourse('${c.id}')" title="Supprimer">
                                <span style="font-weight:700;">${c.matieres?.nom || ''}</span>
                                <span style="font-size:9px;">${type === 'classe' ? (c.profiles?.civilite || 'M.') + ' ' + c.profiles?.nom : c.classes?.nom}</span>
                            </div>
                        `;
                        grid.appendChild(cell);
                    });
                }
            }

            window.deleteCourse = async function(id) {
                if(confirm("Supprimer ce créneau ?")) {
                    await supabase.from('cours_recurrents').delete().eq('id', id);
                    loadSupervisionEDT();
                }
            }

            document.querySelectorAll('.modal-overlay').forEach(m => m.onclick = (e) => { if(e.target === m) m.classList.remove('active'); });

            document.getElementById('form-account').onsubmit = async(e) => {
                e.preventDefault();
                const { data, error } = await secondary.auth.signUp({ email: document.getElementById('acc-email').value, password: document.getElementById('acc-pwd').value });
                if (error) { alert("Erreur Auth : " + error.message); return; }

                await supabase.from('profiles').insert([{
                    id: data.user.id, role: document.getElementById('acc-role').value,
                    civilite: document.getElementById('acc-civilite').value,
                    nom: document.getElementById('acc-nom').value, prenom: document.getElementById('acc-prenom').value
                }]);
                alert("Compte créé !"); location.reload();
            };

            document.getElementById('form-affect').onsubmit = async(e) => { e.preventDefault(); await supabase.from('profiles').update({ classe_id: document.getElementById('affect-class').value }).eq('id', document.getElementById('affect-eleve').value); alert("Associé !"); location.reload(); };
            document.getElementById('form-class').onsubmit = async(e) => { e.preventDefault(); await supabase.from('classes').insert([{nom: document.getElementById('class-name').value}]); location.reload(); };
            document.getElementById('form-subject').onsubmit = async(e) => { e.preventDefault(); await supabase.from('matieres').insert([{nom: document.getElementById('subject-name').value}]); loadSubjectsManager(); document.getElementById('subject-name').value = ''; };
            
            document.getElementById('form-edt').onsubmit = async(e) => {
                e.preventDefault();
                await supabase.from('cours_recurrents').insert([{
                    classe_id: document.getElementById('edt-class').value,
                    prof_id: document.getElementById('edt-prof').value,
                    matiere_id: document.getElementById('edt-subject').value,
                    jour_semaine: parseInt(document.getElementById('edt-jour').value),
                    heure_debut: document.getElementById('edt-start').value,
                    heure_fin: document.getElementById('edt-end').value
                }]);
                alert("Créneau planifié !"); location.reload();
            };

            document.getElementById('btn-logout').onclick = () => supabase.auth.signOut().then(() => location.href = 'index.html');
            toggleViewSelector();
        })();
    </script>
</body>
</html>
