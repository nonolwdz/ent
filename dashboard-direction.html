<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENT - Direction (Lycée Paul de Staël)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #f8fafc; --text-main: #0f172a; --primary: #8b5cf6; --danger: #ef4444; --warning: #f59e0b; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); display: flex; height: 100vh; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #e2e8f0; padding: 24px; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        .card { background: white; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 32px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div style="font-weight:700; margin-bottom:40px;">Lycée Paul de Staël</div>
        <button class="btn-secondary" onclick="location.reload()">Actualiser</button>
        <button class="btn-action" style="margin-top:auto; background:var(--danger);" id="btn-logout">Se déconnecter</button>
    </nav>
    <main class="main-content">
        <h1>Administration Globale</h1>
        <div class="grid">
            <div class="card"><h2>Comptes</h2><button class="btn-action" onclick="toggle('modal-account')">Créer un compte</button></div>
            <div class="card"><h2>Structure</h2><button class="btn-action" onclick="toggle('modal-class')">Créer une classe</button><button class="btn-action" onclick="toggle('modal-subject')">Créer une matière</button></div>
            <div class="card"><h2>Emploi du temps</h2><button class="btn-action" onclick="toggle('modal-edt')">Planifier un cours</button><button class="btn-action" style="background:var(--warning);" onclick="toggle('modal-absence')">Absence Professeur</button></div>
            <div class="card"><h2>Messages</h2><button class="btn-action" onclick="toggle('modal-msg')">Message global</button></div>
        </div>
    </main>

    <!-- Modales -->
    <div class="modal-overlay" id="modal-account"><div class="modal-content"><h3>Nouveau compte</h3><form id="form-account"><div class="form-group"><label>Rôle</label><select id="acc-role"><option value="eleve">Élève</option><option value="professeur">Professeur</option></select></div><input type="text" id="acc-prenom" placeholder="Prénom" required><input type="text" id="acc-nom" placeholder="Nom" required style="margin-top:10px;"><input type="email" id="acc-email" placeholder="Email" required style="margin-top:10px;"><input type="password" id="acc-pwd" placeholder="Mot de passe" required style="margin-top:10px;"><button class="btn-action" style="margin-top:15px;">Créer</button></form></div></div>
    <div class="modal-overlay" id="modal-class"><div class="modal-content"><h3>Nouvelle classe</h3><form id="form-class"><input type="text" id="class-name" placeholder="Nom" required><button class="btn-action" style="margin-top:15px;">Créer</button></form></div></div>
    <div class="modal-overlay" id="modal-subject"><div class="modal-content"><h3>Nouvelle matière</h3><form id="form-subject"><input type="text" id="subject-name" placeholder="Nom" required><button class="btn-action" style="margin-top:15px;">Créer</button></form></div></div>
    <div class="modal-overlay" id="modal-edt"><div class="modal-content"><h3>Planifier cours</h3><form id="form-edt"><select id="edt-class" style="margin-bottom:10px;"></select><select id="edt-prof" style="margin-bottom:10px;"></select><select id="edt-subject" style="margin-bottom:10px;"></select><input type="datetime-local" id="edt-start" required><input type="datetime-local" id="edt-end" required style="margin-top:10px;"><button class="btn-action" style="margin-top:15px;">Planifier</button></form></div></div>
    <div class="modal-overlay" id="modal-absence"><div class="modal-content"><h3>Absence Prof</h3><form id="form-absence"><select id="abs-prof"></select><input type="datetime-local" id="abs-start" required><input type="datetime-local" id="abs-end" required><button class="btn-action" style="background:var(--warning);">Griser cours</button></form></div></div>
    <div class="modal-overlay" id="modal-msg"><div class="modal-content"><h3>Message Global</h3><form id="form-msg"><textarea id="msg-content" required></textarea><button class="btn-action">Envoyer</button></form></div></div>

    <script>
        const supabase = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8');
        const secondary = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8', { auth: { persistSession: false } });

        function toggle(id) { document.getElementById(id).classList.toggle('active'); loadData(); }
        async function loadData() {
            const [profs, classes, subs] = await Promise.all([
                supabase.from('profiles').select('id, nom, prenom').eq('role', 'professeur'),
                supabase.from('classes').select('id, nom'),
                supabase.from('matieres').select('id, nom')
            ]);
            document.querySelectorAll('select').forEach(sel => {
                if(sel.id.includes('prof') && profs.data) sel.innerHTML = profs.data.map(p => `<option value="${p.id}">${p.prenom} ${p.nom}</option>`);
                if(sel.id.includes('class') && classes.data) sel.innerHTML = classes.data.map(c => `<option value="${c.id}">${c.nom}</option>`);
                if(sel.id.includes('subject') && subs.data) sel.innerHTML = subs.data.map(s => `<option value="${s.id}">${s.nom}</option>`);
            });
        }
        
        document.getElementById('form-account').onsubmit = async(e) => { e.preventDefault(); const {data} = await secondary.auth.signUp({email: document.getElementById('acc-email').value, password: document.getElementById('acc-pwd').value}); await supabase.from('profiles').insert([{id: data.user.id, role: document.getElementById('acc-role').value, nom: document.getElementById('acc-nom').value, prenom: document.getElementById('acc-prenom').value}]); alert("Créé !"); location.reload(); };
        document.getElementById('form-class').onsubmit = async(e) => { e.preventDefault(); await supabase.from('classes').insert([{nom: document.getElementById('class-name').value}]); location.reload(); };
        document.getElementById('form-subject').onsubmit = async(e) => { e.preventDefault(); await supabase.from('matieres').insert([{nom: document.getElementById('subject-name').value}]); location.reload(); };
        document.getElementById('form-edt').onsubmit = async(e) => { e.preventDefault(); await supabase.from('cours').insert([{classe_id: document.getElementById('edt-class').value, prof_id: document.getElementById('edt-prof').value, matiere_id: document.getElementById('edt-subject').value, heure_debut: new Date(document.getElementById('edt-start').value).toISOString(), heure_fin: new Date(document.getElementById('edt-end').value).toISOString(), statut: 'maintenu'}]); alert("Planifié !"); location.reload(); };
        document.getElementById('form-absence').onsubmit = async(e) => { e.preventDefault(); await supabase.from('cours').update({statut: 'annule', motif: 'Professeur absent'}).eq('prof_id', document.getElementById('abs-prof').value).gte('heure_debut', new Date(document.getElementById('abs-start').value).toISOString()).lte('heure_fin', new Date(document.getElementById('abs-end').value).toISOString()); alert("Grisé !"); location.reload(); };
        document.getElementById('form-msg').onsubmit = async(e) => { e.preventDefault(); await supabase.from('messages').insert([{contenu: document.getElementById('msg-content').value}]); alert("Diffusé !"); location.reload(); };
        document.getElementById('btn-logout').onclick = () => supabase.auth.signOut().then(() => location.href = 'index.html');
        loadData();
    </script>
</body>
</html>
