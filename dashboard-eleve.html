<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENT - Élève (Lycée Paul de Staël)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #f4f6f9; --text-main: #1e293b; --primary: #0ea5e9; --border-color: #e2e8f0; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; box-shadow: 4px 0 24px rgba(0,0,0,0.02); }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-top: 0; margin-bottom: 20px; color: #0f172a; }

        .schedule-grid { display: grid; grid-template-columns: 90px repeat(5, minmax(150px, 1fr)); grid-template-rows: 50px repeat(9, 65px); background-color: var(--border-color); gap: 1px; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 40px; }
        .grid-header { background: #f8fafc; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #475569; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        .time-label { background: #f8fafc; font-size: 11px; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: 600; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .grid-cell { background: #ffffff; position: relative; border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; }

        .course-card { 
            position: absolute; top: 4px; bottom: 4px; left: 4px; right: 4px; 
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); 
            color: white; border-radius: 10px; padding: 8px 10px; 
            display: flex; flex-direction: column; justify-content: center; 
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }
        .course-title { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
        .course-prof { font-weight: 400; font-size: 10px; opacity: 0.9; }

        .logout-btn { margin-top: auto; padding: 12px; border: none; background: #fee2e2; color: #ef4444; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { background: #fecaca; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div style="font-size:18px; font-weight:700; color:var(--primary); margin-bottom:10px;">Lycée Paul de Staël</div>
        <div id="eleve-info" style="font-size: 13px; color: #64748b; margin-bottom: 40px;">Chargement...</div>
        <button class="logout-btn" id="btn-logout">Se déconnecter</button>
    </nav>
    <main class="main-content">
        <h1>Mon Emploi du Temps</h1>
        <div class="schedule-grid" id="schedule-grid"></div>
    </main>
    <script>
        (function() {
            const supabase = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8');
            
            const slots = [
                { start: "08:30", end: "09:25", row: 2 },
                { start: "09:25", end: "10:20", row: 3 },
                { start: "10:35", end: "11:30", row: 5 },
                { start: "11:30", end: "12:25", row: 6 },
                { start: "13:05", end: "14:00", row: 8 },
                { start: "14:00", end: "14:55", row: 9 },
                { start: "14:55", end: "15:50", row: 10 },
                { start: "16:05", end: "17:00", row: 12 },
                { start: "17:00", end: "17:55", row: 13 }
            ];

            async function init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return location.href = 'index.html';

                const { data: profile } = await supabase.from('profiles').select('*, classes(nom)').eq('id', session.user.id).single();
                if (!profile) return;

                if (!profile.classe_id) {
                    document.getElementById('eleve-info').innerHTML = `<b>${profile.prenom} ${profile.nom}</b><br><span style="color:red;">Aucune classe assignée</span>`;
                    return;
                }

                document.getElementById('eleve-info').innerHTML = `<b>${profile.prenom} ${profile.nom}</b><br>Classe : ${profile.classes?.nom || 'Inconnue'}`;

                buildGridHeaders();
                loadEDT(profile.classe_id);
            }

            function buildGridHeaders() {
                const grid = document.getElementById('schedule-grid');
                let html = `
                    <div class="grid-header" style="grid-column: 1; grid-row: 1;">Horaires</div>
                    <div class="grid-header" style="grid-column: 2; grid-row: 1;">Lundi</div>
                    <div class="grid-header" style="grid-column: 3; grid-row: 1;">Mardi</div>
                    <div class="grid-header" style="grid-column: 4; grid-row: 1;">Mercredi</div>
                    <div class="grid-header" style="grid-column: 5; grid-row: 1;">Jeudi</div>
                    <div class="grid-header" style="grid-column: 6; grid-row: 1;">Vendredi</div>
                `;
                slots.forEach(s => {
                    html += `<div class="time-label" style="grid-column: 1; grid-row: ${s.row};">${s.start}<br><span style="font-size:9px; opacity:0.7;">${s.end}</span></div>`;
                });
                grid.innerHTML = html;
            }

            async function loadEDT(classeId) {
                const { data: cours } = await supabase
                    .from('cours_recurrents')
                    .select('id, jour_semaine, heure_debut, heure_fin, matieres(nom), profiles(nom, civilite)')
                    .eq('classe_id', classeId);

                const grid = document.getElementById('schedule-grid');
                if(cours) {
                    cours.forEach(c => {
                        const startSlot = slots.find(s => s.start === c.heure_debut);
                        const endSlot = slots.find(s => s.end === c.heure_fin);
                        if (!startSlot || !endSlot) return;

                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        cell.style.gridColumn = c.jour_semaine + 1;
                        cell.style.gridRowStart = startSlot.row;
                        const span = (endSlot.row - startSlot.row) + 1;
                        if (span > 1) cell.style.gridRowEnd = `span ${span}`;

                        cell.innerHTML = `
                            <div class="course-card">
                                <span class="course-title">${c.matieres?.nom || 'Matière'}</span>
                                <span class="course-prof">${c.profiles?.civilite || 'M.'} ${c.profiles?.nom || ''}</span>
                            </div>
                        `;
                        grid.appendChild(cell);
                    });
                }
            }

            document.getElementById('btn-logout').onclick = () => supabase.auth.signOut().then(() => location.href = 'index.html');
            init();
        })();
    </script>
</body>
</html>
