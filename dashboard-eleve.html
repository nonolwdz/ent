<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENT - Élève (Lycée Paul de Staël)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #f8fafc; --text-main: #0f172a; --primary: #0ea5e9; --border-color: #e2e8f0; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .schedule-grid { display: grid; grid-template-columns: 60px repeat(5, minmax(150px, 1fr)); grid-template-rows: 40px repeat(9, 60px); gap: 2px; background-color: var(--border-color); border: 1px solid var(--border-color); margin-top: 20px; }
        .grid-header { background: #f8fafc; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .time-label { background: #f8fafc; font-size: 12px; display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 5px; color: #64748b; }
        .grid-cell { background: #ffffff; position: relative; }
        .course-card { position: absolute; top: 2px; bottom: 2px; left: 2px; right: 2px; background: var(--primary); color: white; border-radius: 6px; padding: 5px; font-size: 11px; display: flex; flex-direction: column; justify-content: center; text-align: center; font-weight: 600; }
        .logout-btn { margin-top: auto; padding: 12px; border: 1px solid #ef4444; color: #ef4444; background: transparent; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div style="font-size:18px; font-weight:700; color:var(--primary); margin-bottom:40px;">Lycée Paul de Staël</div>
        <button class="logout-btn" id="btn-logout">Se déconnecter</button>
    </nav>
    <main class="main-content">
        <h1 id="page-title">Mon Emploi du Temps (Récurrent)</h1>
        <div class="schedule-container">
            <div class="schedule-grid" id="schedule-grid">
                <div class="grid-header"></div><div class="grid-header">Lundi</div><div class="grid-header">Mardi</div><div class="grid-header">Mercredi</div><div class="grid-header">Jeudi</div><div class="grid-header">Vendredi</div>
            </div>
        </div>
    </main>
    <script>
        (function() {
            const supabase = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8');
            
            async function init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return window.location.href = 'index.html';

                const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
                if (!profile || !profile.classe_id) {
                    alert("Votre compte n'est rattaché à aucune classe. Contactez la direction.");
                    return;
                }

                buildGridHeaders();
                loadEDT(profile.classe_id);
            }

            function buildGridHeaders() {
                const grid = document.getElementById('schedule-grid');
                for(let i = 8; i <= 16; i++) {
                    grid.innerHTML += `<div class="time-label" style="grid-column: 1; grid-row: ${i - 6};">${i < 10 ? '0'+i : i}h00</div>`;
                }
            }

            async function loadEDT(classeId) {
                const { data: cours } = await supabase
                    .from('cours_recurrents')
                    .select('id, jour_semaine, heure_debut, heure_fin, matieres(nom), profiles(nom)')
                    .eq('classe_id', classeId);

                const grid = document.getElementById('schedule-grid');
                if(cours) {
                    cours.forEach(c => {
                        const startHour = parseInt(c.heure_debut.split(':')[0]);
                        const endHour = parseInt(c.heure_fin.split(':')[0]);
                        const duration = endHour - startHour;

                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        cell.style.gridColumn = c.jour_semaine + 1; // 1 = Lundi -> Col 2
                        cell.style.gridRowStart = startHour - 6;
                        if (duration > 1) cell.style.gridRowEnd = `span ${duration}`;

                        cell.innerHTML = `
                            <div class="course-card">
                                <span>${c.matieres ? c.matieres.nom : 'Matière'}</span>
                                <span style="font-weight:normal; font-size:10px;">M. ${c.profiles ? c.profiles.nom : ''}</span>
                            </div>
                        `;
                        grid.appendChild(cell);
                    });
                }
            }

            document.getElementById('btn-logout').onclick = () => supabase.auth.signOut().then(() => location.href = 'index.html');
            init();
        })();
    </script>
</body>
</html>
