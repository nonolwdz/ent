<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENT - Enseignant (Lycée Paul de Staël)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #f8fafc; --text-main: #0f172a; --primary: #f59e0b; --border-color: #e2e8f0; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .schedule-grid { display: grid; grid-template-columns: 80px repeat(5, minmax(150px, 1fr)); grid-template-rows: 35px repeat(9, 45px); gap: 2px; background-color: var(--border-color); border: 1px solid var(--border-color); margin-top: 20px; }
        .grid-header { background: #f8fafc; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .time-label { background: #f8fafc; font-size: 10px; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; color: #64748b; font-weight: 500; }
        .grid-cell { background: #ffffff; position: relative; }
        .course-card { position: absolute; top: 2px; bottom: 2px; left: 2px; right: 2px; background: var(--primary); color: white; border-radius: 6px; padding: 4px; font-size: 11px; display: flex; flex-direction: column; justify-content: center; text-align: center; font-weight: 600; }
        .logout-btn { margin-top: auto; padding: 12px; border: 1px solid #ef4444; color: #ef4444; background: transparent; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div style="font-size:18px; font-weight:700; color:var(--primary); margin-bottom:10px;">Lycée Paul de Staël</div>
        <div id="prof-name" style="font-size: 14px; font-weight: 600; margin-bottom: 40px; color: #64748b;">Chargement...</div>
        <button class="logout-btn" id="btn-logout">Se déconnecter</button>
    </nav>
    <main class="main-content">
        <h1>Mon Emploi du Temps Professeur</h1>
        <div class="schedule-grid" id="schedule-grid"></div>
    </main>
    <script>
        (function() {
            const supabase = window.supabase.createClient('https://sxbifhwmhjvdchjncnpq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8');
            
            const slots = [
                { start: "08:30", end: "09:25", row: 1 },
                { start: "09:25", end: "10:20", row: 2 },
                { start: "10:35", end: "11:30", row: 4 },
                { start: "11:30", end: "12:25", row: 5 },
                { start: "13:05", end: "14:00", row: 7 },
                { start: "14:00", end: "14:55", row: 8 },
                { start: "14:55", end: "15:50", row: 9 },
                { start: "16:05", end: "17:00", row: 11 },
                { start: "17:00", end: "17:55", row: 12 }
            ];

            async function init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return location.href = 'index.html';

                const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
                if (!profile) return;

                document.getElementById('prof-name').innerText = `${profile.civilite || 'M.'} ${profile.prenom} ${profile.nom}`;

                buildGridHeaders();
                loadProfEDT(session.user.id);
            }

            function buildGridHeaders() {
                const grid = document.getElementById('schedule-grid');
                let html = '<div class="grid-header"></div><div class="grid-header">Lundi</div><div class="grid-header">Mardi</div><div class="grid-header">Mercredi</div><div class="grid-header">Jeudi</div><div class="grid-header">Vendredi</div>';
                slots.forEach(s => {
                    html += `<div class="time-label" style="grid-column: 1; grid-row: ${s.row};">${s.start} - ${s.end}</div>`;
                });
                grid.innerHTML = html;
            }

            async function loadProfEDT(profId) {
                const { data: cours } = await supabase
                    .from('cours_recurrents')
                    .select('id, jour_semaine, heure_debut, heure_fin, matieres(nom), classes(nom)')
                    .eq('prof_id', profId);

                const grid = document.getElementById('schedule-grid');
                if(cours) {
                    cours.forEach(c => {
                        const startSlot = slots.find(s => s.start === c.heure_debut);
                        const endSlot = slots.find(s => s.end === c.heure_fin);
                        if (!startSlot || !endSlot) return;

                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        cell.style.gridColumn = c.jour_semaine + 1;
                        cell.style.gridRowStart = startSlot.row;
                        const span = (endSlot.row - startSlot.row) + 1;
                        if (span > 1) cell.style.gridRowEnd = `span ${span}`;

                        cell.innerHTML = `
                            <div class="course-card">
                                <span>${c.matieres?.nom || 'Matière'}</span>
                                <span style="font-weight:normal; font-size:10px;">Classe : ${c.classes?.nom || ''}</span>
                            </div>
                        `;
                        grid.appendChild(cell);
                    });
                }
            }

            document.getElementById('btn-logout').onclick = () => supabase.auth.signOut().then(() => location.href = 'index.html');
            init();
        })();
    </script>
</body>
</html>
