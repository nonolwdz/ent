<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Espace Professeur</title>
    <!-- Importation de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barre latérale */
        .sidebar {
            width: 250px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 2rem;
            text-align: center;
        }

        .nav-link {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .nav-link.active {
            background-color: var(--primary);
            color: white;
        }

        .logout-btn {
            margin-top: auto;
            padding: 0.75rem 1rem;
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        /* Contenu principal */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .user-info {
            background-color: var(--surface);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 600;
        }

        /* Grille de l'emploi du temps */
        .schedule-grid {
            display: grid;
            grid-template-columns: 60px repeat(5, 1fr);
            gap: 1rem;
            background-color: var(--surface);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .day-header {
            font-weight: bold;
            text-align: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
        }

        .time-col {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-top: 1rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-align: right;
            padding-right: 0.5rem;
        }

        .course-card {
            background-color: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .course-title {
            font-weight: bold;
            color: var(--primary);
            margin: 0;
        }

        .course-info {
            font-size: 0.85rem;
            margin: 0;
            color: var(--text-light);
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            margin-top: 0.5rem;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Fenêtre modale pour l'appel */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .student-name {
            font-weight: 600;
        }

        .attendance-options {
            display: flex;
            gap: 1rem;
        }

        .attendance-options label {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
        }
        
        .save-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
        }

        .save-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <!-- Barre latérale -->
    <nav class="sidebar">
        <div class="logo-area">Mon ENT</div>
        <a class="nav-link active">📅 Emploi du temps</a>
        <a class="nav-link">📝 Ajouter un devoir</a>
        <a class="nav-link">💬 Messagerie</a>
        
        <button class="logout-btn" onclick="handleLogout()">Se déconnecter</button>
    </nav>

    <!-- Zone principale -->
    <main class="main-content">
        <header class="header">
            <h1 id="welcome-message">Emploi du temps - Enseignant</h1>
            <div class="user-info" id="user-name">Chargement...</div>
        </header>

        <!-- Grille de l'emploi du temps -->
        <div class="schedule-grid">
            <div></div>
            <div class="day-header">Lundi</div>
            <div class="day-header">Mardi</div>
            <div class="day-header">Mercredi</div>
            <div class="day-header">Jeudi</div>
            <div class="day-header">Vendredi</div>

            <div class="time-col">
                <span>08:00</span>
                <span>09:00</span>
                <span>10:00</span>
                <span>11:00</span>
            </div>

            <!-- Exemple de cours avec bouton pour faire l'appel -->
            <div>
                <div class="course-card">
                    <p class="course-title">Classe : 3ème A</p>
                    <p class="course-info">08:00 - 10:00 • Salle 12</p>
                    <button class="action-btn" onclick="openAttendanceModal('3ème A')">Faire l'appel</button>
                </div>
            </div>

            <!-- Les autres jours sont vides pour l'exemple -->
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </main>

    <!-- Fenêtre Modale pour faire l'appel -->
    <div class="modal-overlay" id="attendance-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-class-title">Appel : </h2>
                <button class="close-btn" onclick="closeAttendanceModal()">&times;</button>
            </div>
            
            <form onsubmit="saveAttendance(event)">
                <!-- Liste factice d'élèves pour la démonstration -->
                <div class="student-row">
                    <span class="student-name">Martin Dupont</span>
                    <div class="attendance-options">
                        <label><input type="radio" name="student1" value="present" checked> Présent</label>
                        <label><input type="radio" name="student1" value="retard"> Retard</label>
                        <label><input type="radio" name="student1" value="absent"> Absent</label>
                    </div>
                </div>
                
                <div class="student-row">
                    <span class="student-name">Léa Girard</span>
                    <div class="attendance-options">
                        <label><input type="radio" name="student2" value="present" checked> Présent</label>
                        <label><input type="radio" name="student2" value="retard"> Retard</label>
                        <label><input type="radio" name="student2" value="absent"> Absent</label>
                    </div>
                </div>

                <div class="student-row">
                    <span class="student-name">Thomas Leroy</span>
                    <div class="attendance-options">
                        <label><input type="radio" name="student3" value="present" checked> Présent</label>
                        <label><input type="radio" name="student3" value="retard"> Retard</label>
                        <label><input type="radio" name="student3" value="absent"> Absent</label>
                    </div>
                </div>

                <button type="submit" class="save-btn">Valider l'appel</button>
            </form>
        </div>
    </div>

    <script>
        // 1. Initialisation de Supabase
        const supabaseUrl = 'https://sxbifhwmhjvdchjncnpq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Gestion de la modale d'appel (Interface visuelle)
        function openAttendanceModal(className) {
            document.getElementById('modal-class-title').innerText = 'Appel : ' + className;
            document.getElementById('attendance-modal').classList.add('active');
        }

        function closeAttendanceModal() {
            document.getElementById('attendance-modal').classList.remove('active');
        }

        function saveAttendance(event) {
            event.preventDefault();
            alert("L'appel a été validé et enregistré !");
            closeAttendanceModal();
        }

        // 3. Vérification de la session
        async function checkSession() {
            const { data: { session }, error } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            fetchUserProfile(session.user.id);
        }

        // 4. Récupération et vérification du profil
        async function fetchUserProfile(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('nom, prenom, role')
                .eq('id', userId)
                .single();

            if (error) {
                console.error("Erreur lors de la récupération du profil :", error);
                return;
            }

            // Sécurité : On s'assure que seul un enseignant peut voir cette page
            if (data.role !== 'professeur') {
                alert("Accès non autorisé. Vous n'avez pas les droits d'enseignant.");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('user-name').innerText = `M. ${data.nom} (Enseignant)`;
        }

        // 5. Déconnexion
        async function handleLogout() {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert("Erreur lors de la déconnexion.");
                console.error(error);
            } else {
                window.location.href = 'index.html';
            }
        }

        // Lancement au chargement
        checkSession();
    </script>
</body>
</html>
