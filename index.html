<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Portail de connexion</title>
    
    <!-- Police professionnelle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            /* Palette de couleurs plus riche mais pro */
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --card-bg: #ffffff;
            --text-main: #102a43;
            --text-secondary: #627d98;
            --border-light: #bcccdc;
            
            /* Couleurs spécifiques par rôle */
            --color-eleve: #0ea5e9;    /* Bleu ciel vif */
            --bg-eleve: #e0f2fe;
            
            --color-prof: #f59e0b;     /* Ambre/Orange */
            --bg-prof: #fef3c7;
            
            --color-dir: #8b5cf6;      /* Violet moderne */
            --bg-dir: #ede9fe;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Design de la carte */
        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(16, 42, 67, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Ligne colorée décorative en haut de la carte */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--color-eleve), var(--color-prof), var(--color-dir));
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Sélection des rôles */
        #role-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .role-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1rem;
            background: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .role-btn svg { width: 22px; height: 22px; }

        /* Couleurs dynamiques au survol */
        #btn-eleve:hover { border-color: var(--color-eleve); transform: translateY(-2px); }
        #btn-eleve .icon-box { background-color: var(--bg-eleve); color: var(--color-eleve); }
        
        #btn-prof:hover { border-color: var(--color-prof); transform: translateY(-2px); }
        #btn-prof .icon-box { background-color: var(--bg-prof); color: var(--color-prof); }
        
        #btn-direction:hover { border-color: var(--color-dir); transform: translateY(-2px); }
        #btn-direction .icon-box { background-color: var(--bg-dir); color: var(--color-dir); }

        /* Formulaire */
        #form-section { display: none; }
        #form-section.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-main);
        }

        .input-group { margin-bottom: 1.2rem; }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        /* Le focus du formulaire s'adaptera en JavaScript selon le rôle */
        .input-group input:focus {
            border-color: var(--active-color, #333);
            box-shadow: 0 0 0 3px var(--active-shadow, rgba(0,0,0,0.1));
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--active-color, #333);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header" id="main-header">
            <h1>Mon ENT</h1>
            <p>Portail de connexion sécurisé</p>
        </div>

        <!-- Choix des rôles -->
        <div id="role-section">
            <button class="role-btn" id="btn-eleve">
                <div class="icon-box">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path></svg>
                </div>
                Élève
            </button>
            
            <button class="role-btn" id="btn-prof">
                <div class="icon-box">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                Enseignant
            </button>
            
            <button class="role-btn" id="btn-direction">
                <div class="icon-box">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                Direction
            </button>
        </div>

        <!-- Formulaire -->
        <div id="form-section">
            <div class="form-title" id="form-role-title">Connexion</div>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Identifiant ou Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
            </form>
            
            <a class="back-link" id="btn-back">← Choisir un autre profil</a>
        </div>
    </div>

    <!-- Script JavaScript avec messages d'erreur détaillés -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const roleSection = document.getElementById('role-section');
            const formSection = document.getElementById('form-section');
            const mainHeader = document.getElementById('main-header');
            const formRoleTitle = document.getElementById('form-role-title');
            const emailInput = document.getElementById('email');
            
            let selectedRole = '';

            // Configuration des couleurs selon le profil choisi
            const roleConfigs = {
                'Élève': { color: 'var(--color-eleve)', shadow: 'rgba(14, 165, 233, 0.15)', placeholder: 'eleve@lycee.fr' },
                'Enseignant': { color: 'var(--color-prof)', shadow: 'rgba(245, 158, 11, 0.15)', placeholder: 'professeur@lycee.fr' },
                'Direction': { color: 'var(--color-dir)', shadow: 'rgba(139, 92, 246, 0.15)', placeholder: 'direction@lycee.fr' }
            };

            function openForm(role) {
                selectedRole = role;
                roleSection.style.display = 'none';
                mainHeader.style.display = 'none';
                formSection.classList.add('active');
                
                formRoleTitle.innerText = `Espace ${role}`;
                emailInput.placeholder = roleConfigs[role].placeholder;
                
                // Applique la couleur spécifique au formulaire
                document.documentElement.style.setProperty('--active-color', roleConfigs[role].color);
                document.documentElement.style.setProperty('--active-shadow', roleConfigs[role].shadow);
            }

            document.getElementById('btn-eleve').addEventListener('click', () => openForm('Élève'));
            document.getElementById('btn-prof').addEventListener('click', () => openForm('Enseignant'));
            document.getElementById('btn-direction').addEventListener('click', () => openForm('Direction'));

            document.getElementById('btn-back').addEventListener('click', () => {
                formSection.classList.remove('active');
                roleSection.style.display = 'flex';
                mainHeader.style.display = 'block';
                document.getElementById('login-form').reset();
            });

            // Initialisation de Supabase
            const supabaseUrl = 'https://sxbifhwmhjvdchjncnpq.supabase.co';

            let supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // Logique de connexion
            document.getElementById('login-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const email = emailInput.value;
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('submit-btn');

                submitBtn.innerText = "Connexion en cours...";
                submitBtn.disabled = true;

                try {
                    // 1. Vérification Email / Mot de passe
                    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (authError) {
                        throw new Error("Authentification échouée : L'email ou le mot de passe est incorrect.");
                    }

                    // 2. Vérification de la table Profiles

                        .from('profiles')
                        .select('role')
                        .eq('id', authData.user.id)
                        .single();

                    if (profileError || !profileData) {
                        throw new Error("Profil manquant : Le compte existe, mais il n'a pas été ajouté dans la table 'profiles' de la base de données.");
                    }

    return;
}
                }
            });
        });
    </script>
</body>
</html>
