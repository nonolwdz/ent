<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Connexion</title>
    <!-- Chargement de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Design Sobre et Professionnel */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            color: var(--text-dark);
        }

        .login-container {
            background: #ffffff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Boutons de sélection de rôle */
        .role-selection {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .role-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .role-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f8fafc;
        }

        /* Formulaire */
        .login-form {
            display: none; /* Caché par défaut */
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .login-form.active {
            display: flex;
        }

        .role-badge {
            align-self: center;
            color: var(--primary);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0e7ff;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        input {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        
        .back-btn:hover {
            color: var(--text-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Mon ENT</h1>
        <p class="subtitle" id="instruction-text">Portail de connexion sécurisé</p>

        <!-- Étape 1 : Choix du rôle -->
        <div class="role-selection" id="role-selection">
            <!-- Ajout de type="button" pour éviter tout conflit -->
            <button class="role-btn" type="button" onclick="showForm('Élève')">Je suis Élève</button>
            <button class="role-btn" type="button" onclick="showForm('Enseignant')">Je suis Enseignant</button>
            <button class="role-btn" type="button" onclick="showForm('Direction')">Je suis la Direction</button>
        </div>

        <!-- Étape 2 : Formulaire -->
        <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
            
            <div class="role-badge" id="selected-role-title">Connexion</div>
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required placeholder="nom@etablissement.fr">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
            <button type="button" class="back-btn" onclick="showRoles()">Retour au choix du profil</button>
        </form>
    </div>

    <script>
        // Fonctions d'interface : bascule instantanée sans attendre Supabase
        let currentRole = '';

        function showForm(role) {
            currentRole = role;
            document.getElementById('role-selection').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            
            const form = document.getElementById('login-form');
            form.classList.add('active');
            
            document.getElementById('selected-role-title').innerText = 'Espace ' + role;
            
            const emailInput = document.getElementById('email');
            if (role === 'Élève') emailInput.placeholder = 'eleve@lycee.fr';
            else if (role === 'Enseignant') emailInput.placeholder = 'professeur@lycee.fr';
            else emailInput.placeholder = 'direction@lycee.fr';
        }

        function showRoles() {
            currentRole = '';
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('role-selection').style.display = 'flex';
            document.getElementById('instruction-text').style.display = 'block';
            
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Initialisation de Supabase
        const supabaseUrl = 'https://sxbifhwmhjvdchjncnpq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Logique de connexion
        async function handleLogin(event) {
            event.preventDefault(); 

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.innerText = "Connexion en cours...";
            submitBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (authError) throw authError;

                const { data: profileData, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) throw profileError;

                const roleDb = profileData.role.toLowerCase();
                const roleChoisi = currentRole.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                if (roleDb !== roleChoisi) {
                    alert(`Accès refusé : Votre compte est enregistré en tant que '${roleDb}'.`);
                    await supabase.auth.signOut();
                    showRoles();
                    return;
                }

                if (roleDb === 'eleve') window.location.href = 'dashboard-eleve.html';
                else if (roleDb === 'professeur') window.location.href = 'dashboard-prof.html';
                else if (roleDb === 'direction') window.location.href = 'dashboard-direction.html';

            } catch (error) {
                alert("Erreur : Identifiants incorrects ou compte inexistant.");
                console.error(error);
            } finally {
                submitBtn.innerText = "Se connecter";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
