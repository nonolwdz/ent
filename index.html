<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Connexion</title>
    <style>
        :root {
            --primary: #4f46e5; /* Un bleu-violet moderne et dynamique */
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
        }

        .login-container {
            background-color: var(--surface);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Sélection du rôle */
        .role-selection {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .role-btn {
            background-color: transparent;
            border: 2px solid #e5e7eb;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f5f3ff;
        }

        /* Formulaire de connexion (caché par défaut) */
        .login-form {
            display: none;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
        }

        .login-form.active {
            display: flex;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
        }

        input {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .back-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Bienvenue sur votre ENT !</h1>
        <p class="subtitle" id="instruction-text">Veuillez sélectionner votre profil pour vous connecter.</p>

        <!-- Étape 1 : Choix du rôle -->
        <div class="role-selection" id="role-selection">
            <button class="role-btn" onclick="showForm('Élève')">🎓 Élève</button>
            <button class="role-btn" onclick="showForm('Enseignant')">🍎 Enseignant</button>
            <button class="role-btn" onclick="showForm('Direction')">🏢 Direction</button>
        </div>

        <!-- Étape 2 : Formulaire de connexion -->
        <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
            <h2 id="selected-role-title" style="margin-top: 0; text-align: center; color: var(--primary); font-size: 1.2rem;"></h2>
            
            <label for="email">Identifiant ou Email</label>
            <input type="email" id="email" required placeholder="nom@etablissement.fr">
            
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
            
            <button type="submit" class="submit-btn">Se connecter</button>
            <button type="button" class="back-btn" onclick="showRoles()">Retour au choix du profil</button>
        </form>
    </div>

    <script>
        let currentRole = '';

        function showForm(role) {
            currentRole = role;
            document.getElementById('role-selection').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            
            const form = document.getElementById('login-form');
            form.classList.add('active');
            
            document.getElementById('selected-role-title').innerText = 'Connexion ' + role;
        }

        function showRoles() {
            currentRole = '';
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('role-selection').style.display = 'flex';
            document.getElementById('instruction-text').style.display = 'block';
        }

        function handleLogin(event) {
            event.preventDefault();
            // Ici, nous ajouterons plus tard le code pour connecter l'utilisateur via Supabase
            alert("Tentative de connexion en tant que : " + currentRole);
        }
    </script>
</body>
</html>
