<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Connexion</title>
    <!-- Importation de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
        }

        .login-container {
            background-color: var(--surface);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .role-selection {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .role-btn {
            background-color: transparent;
            border: 2px solid #e5e7eb;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f5f3ff;
        }

        .login-form {
            display: none;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
        }

        .login-form.active {
            display: flex;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
        }

        input {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .back-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Bienvenue sur votre ENT !</h1>
        <p class="subtitle" id="instruction-text">Veuillez sélectionner votre profil pour vous connecter.</p>

        <div class="role-selection" id="role-selection">
            <button class="role-btn" onclick="showForm('Élève')">🎓 Élève</button>
            <button class="role-btn" onclick="showForm('Enseignant')">🍎 Enseignant</button>
            <button class="role-btn" onclick="showForm('Direction')">🏢 Direction</button>
        </div>

        <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
            <h2 id="selected-role-title" style="margin-top: 0; text-align: center; color: var(--primary); font-size: 1.2rem;"></h2>
            
            <label for="email">Identifiant ou Email</label>
            <input type="email" id="email" required placeholder="nom@etablissement.fr">
            
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
            
            <button type="submit" class="submit-btn">Se connecter</button>
            <button type="button" class="back-btn" onclick="showRoles()">Retour au choix du profil</button>
        </form>
    </div>

    <script>
        // 1. Initialisation de Supabase avec tes vraies clés
        const supabaseUrl = 'https://sxbifhwmhjvdchjncnpq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentRole = '';

        function showForm(role) {
            currentRole = role;
            document.getElementById('role-selection').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            
            const form = document.getElementById('login-form');
            form.classList.add('active');
            
            document.getElementById('selected-role-title').innerText = 'Connexion ' + role;
            
            const emailInput = document.getElementById('email');
            if (role === 'Élève') emailInput.placeholder = 'eleve@lycee-stael.fr';
            else if (role === 'Enseignant') emailInput.placeholder = 'professeur@lycee-stael.fr';
            else emailInput.placeholder = 'direction@lycee-stael.fr';
        }

        function showRoles() {
            currentRole = '';
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('role-selection').style.display = 'flex';
            document.getElementById('instruction-text').style.display = 'block';
            
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        async function handleLogin(event) {
            event.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.submit-btn');
            
            submitBtn.innerText = "Connexion en cours...";
            submitBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (authError) throw authError;

                const { data: profileData, error: profileError } = await supabase
                    .from('profiles')
                    .select('role, nom, prenom')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) throw profileError;

                const roleDb = profileData.role.toLowerCase();
                const roleChoisi = currentRole.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                if (roleDb !== roleChoisi) {
                    alert(`Erreur : Votre compte est configuré comme ${profileData.role}, mais vous avez choisi ${currentRole}.`);
                    await supabase.auth.signOut();
                    showRoles();
                    return;
                }

                if (roleDb === 'eleve') window.location.href = 'dashboard-eleve.html';
                else if (roleDb === 'professeur') window.location.href = 'dashboard-prof.html';
                else if (roleDb === 'direction') window.location.href = 'dashboard-direction.html';

            } catch (error) {
                alert("Erreur de connexion : Vérifiez votre email et votre mot de passe.");
                console.error(error);
            } finally {
                submitBtn.innerText = "Se connecter";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
