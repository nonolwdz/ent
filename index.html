<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT - Portail de connexion</title>
    
    <!-- Police professionnelle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase (chargé une seule fois ici) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --card-bg: #ffffff;
            --text-main: #102a43;
            --text-secondary: #627d98;
            --border-light: #bcccdc;
            --color-eleve: #0ea5e9; --bg-eleve: #e0f2fe;
            --color-prof: #f59e0b; --bg-prof: #fef3c7;
            --color-dir: #8b5cf6; --bg-dir: #ede9fe;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-main); }

        .login-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 20px; box-shadow: 0 20px 40px rgba(16, 42, 67, 0.08); position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--color-eleve), var(--color-prof), var(--color-dir)); }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { margin: 0 0 0.5rem 0; font-size: 1.6rem; font-weight: 700; }
        .header p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }

        #role-section { display: flex; flex-direction: column; gap: 1rem; }
        .role-btn { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1rem; background: var(--card-bg); border: 2px solid var(--border-light); border-radius: 14px; font-size: 1.05rem; font-weight: 600; color: var(--text-main); cursor: pointer; transition: all 0.2s ease; }
        .icon-box { display: flex; justify-content: center; align-items: center; width: 42px; height: 42px; border-radius: 10px; }
        
        #btn-eleve:hover { border-color: var(--color-eleve); transform: translateY(-2px); }
        #btn-eleve .icon-box { background-color: var(--bg-eleve); color: var(--color-eleve); }
        #btn-prof:hover { border-color: var(--color-prof); transform: translateY(-2px); }
        #btn-prof .icon-box { background-color: var(--bg-prof); color: var(--color-prof); }
        #btn-direction:hover { border-color: var(--color-dir); transform: translateY(-2px); }
        #btn-direction .icon-box { background-color: var(--bg-dir); color: var(--color-dir); }

        #form-section { display: none; }
        #form-section.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-secondary); }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid var(--border-light); border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; }
        
        .submit-btn { width: 100%; padding: 0.9rem; background-color: var(--active-color, #333); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .back-link { display: block; text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header" id="main-header">
            <h1>Mon ENT</h1>
            <p>Portail de connexion du Lycée Paul de Staël</p>
        </div>

        <div id="role-section">
            <button class="role-btn" id="btn-eleve"><div class="icon-box">👤</div>Élève</button>
            <button class="role-btn" id="btn-prof"><div class="icon-box">👨‍🏫</div>Enseignant</button>
            <button class="role-btn" id="btn-direction"><div class="icon-box">🏢</div>Direction</button>
        </div>

        <div id="form-section">
            <div style="text-align:center; font-weight:700; margin-bottom:1.5rem;" id="form-role-title">Connexion</div>
            <form id="login-form">
                <div class="input-group"><label>Email</label><input type="email" id="email" required></div>
                <div class="input-group"><label>Mot de passe</label><input type="password" id="password" required></div>
                <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
            </form>
            <span class="back-link" id="btn-back">← Choisir un autre profil</span>
        </div>
    </div>

    <script>
        // Utilisation d'une fonction isolée pour éviter toute redondance de variables globales
        (function() {
            const sbUrl = 'https://sxbifhwmhjvdchjncnpq.supabase.co';
            const sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YmlmaHdtaGp2ZGNoam5jbnBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ1NzAsImV4cCI6MjEwMjczMDU3MH0.rYF2Xaaz7fPfFfHP4c6WKCx1rtDqchUDnVkqZAjY6p8';
            const db = window.supabase.createClient(sbUrl, sbKey);
            
            let selectedRole = '';
            const roleConfigs = {
                'eleve': { title: 'Élève', color: '#0ea5e9' },
                'professeur': { title: 'Enseignant', color: '#f59e0b' },
                'direction': { title: 'Direction', color: '#8b5cf6' }
            };

            function openForm(roleKey) {
                selectedRole = roleKey;
                document.getElementById('role-section').style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('form-section').classList.add('active');
                document.getElementById('form-role-title').innerText = 'Connexion ' + roleConfigs[roleKey].title;
                document.documentElement.style.setProperty('--active-color', roleConfigs[roleKey].color);
            }

            document.getElementById('btn-eleve').onclick = () => openForm('eleve');
            document.getElementById('btn-prof').onclick = () => openForm('professeur');
            document.getElementById('btn-direction').onclick = () => openForm('direction');
            document.getElementById('btn-back').onclick = () => location.reload();

            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submit-btn');
                btn.innerText = "Connexion..."; btn.disabled = true;

                try {
                    const { data: auth, error: authErr } = await db.auth.signInWithPassword({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    });
                    if (authErr) throw authErr;

                    const { data: profile } = await db.from('profiles').select('role').eq('id', auth.user.id).single();
                    
                    if (profile.role !== selectedRole) {
                        await db.auth.signOut();
                        alert(`Accès refusé : Votre compte est configuré comme '${profile.role}', pas comme '${selectedRole}'.`);
                        location.reload();
                    } else {
                        const pages = { 'eleve': 'dashboard-eleve.html', 'professeur': 'dashboard-prof.html', 'direction': 'dashboard-direction.html' };
                        location.href = pages[profile.role];
                    }
                } catch (err) {
                    alert("Erreur : " + err.message);
                    btn.innerText = "Se connecter"; btn.disabled = false;
                }
            };
        })();
    </script>
</body>
</html>
